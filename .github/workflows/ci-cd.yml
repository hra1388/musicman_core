name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, json, curl

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run Tests
      run: php tests/runner.php

    - name: Build Docker Image
      run: docker build -t musicman/api:latest -f docker/Dockerfile .
