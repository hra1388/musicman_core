version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: musicman_app
    restart: unless-stopped
    volumes:
      - ../:/var/www/html
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_NAME=musicman
      - DB_USER=musicman
      - DB_PASS=secret_password
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: musicman_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: musicman_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: musicman
      MYSQL_USER: musicman
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
